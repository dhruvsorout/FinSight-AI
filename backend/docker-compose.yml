version: "3.9"

services:
  ai-service:
    build:
      context: .
      dockerfile: apps/ai-service/Dockerfile
    container_name: finsight-ai-service
    restart: unless-stopped
    env_file:
      - apps/ai-service/.env
    environment:
      PORT: 8000
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: finsight-api
    restart: unless-stopped
    depends_on:
      ai-service:
        condition: service_started
    env_file:
      - apps/api/.env
    environment:
      AI_SERVICE_URL: http://ai-service:8000
      PORT: 3000
    ports:
      - "3000:3000"